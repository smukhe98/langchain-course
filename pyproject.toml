[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

authors = [
    { name = "Sreyashee", email = "146114883+SMUKHE1998@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.5.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.8.0",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
langchain-course = "langchain_course:main"

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
site-package-path = [".venv/lib/python3.12/site-packages"]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
